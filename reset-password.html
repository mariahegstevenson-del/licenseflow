<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Set a new password — LicenseFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@600;700;800&display=swap"/>
<link rel="stylesheet" href="auth.css?v=5"/>
<script src="config.js"></script>
</head>
<body>
<div class="screen">
  <div class="screen-inner">
    <a class="brand" href="index.html" style="justify-content:center;margin-bottom:20px"><span class="mark">L</span> LicenseFlow</a>
    <div class="card pad">
      <h2 id="title" style="text-align:center;font-size:1.5rem">Set a new password</h2>
      <p class="muted center" id="sub" style="margin-top:0">Checking your link…</p>
      <div id="alert" class="alert"></div>

      <form id="form" style="display:none">
        <label for="password">New password</label>
        <input id="password" type="password" required minlength="8" autocomplete="new-password"/>
        <p class="hint">At least 8 characters.</p>
        <label for="confirm">Confirm new password</label>
        <input id="confirm" type="password" required minlength="8" autocomplete="new-password"/>
        <button id="submit" class="btn btn-primary btn-block" type="submit" style="margin-top:18px">Save new password</button>
      </form>

      <p class="hint center" id="actions" style="display:none;margin-top:14px">
        <a href="login.html?mode=login">Back to log in</a>
      </p>
    </div>
  </div>
</div>
<script type="module" src="reset-password.js?v=2"></script>
</body>
</html>
