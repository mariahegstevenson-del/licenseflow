<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LicenseFlow — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@600;700;800&display=swap"/>
<link rel="stylesheet" href="styles.css?v=37"/>
<link rel="stylesheet" href="admin.css?v=37"/>
<script src="config.js"></script>
</head>
<body>

<div class="cc-top">
  <a class="cc-brand" href="admin.html"><span class="mark">L</span> LicenseFlow
    <span class="tag-agency">Command Center</span>
    <span class="cc-agency" data-agency-name hidden></span></a>
  <div style="display:flex;gap:9px;align-items:center">
    <a class="btn btn-quiet btn-sm" href="app.html">Agent view</a>
    <button class="btn btn-quiet btn-sm" id="logout">Log out</button>
  </div>
</div>

<!-- Filled by renderTabs() for LicenseFlow staff only: one tab per
     agency, so switching between them never means changing domain or
     signing in as somebody else. -->
<div class="cc-tabs" id="tabs" hidden></div>

<!-- The three halves of the job. Filled by renderSections(): clicking
     one swaps what the left nav is listing, so nobody has to read past
     twelve unrelated entries to find the one they want. -->
<div class="cc-secbar" id="secbar" hidden></div>

<div class="cc-body">
  <!-- A narrow gutter, not a list. Everything that used to be down the
       side is behind the button, so the page starts where the work is. -->
  <div class="cc-gutter">
    <button class="cc-burger" id="navOpen" type="button" aria-label="Open the menu">
      <span class="b"></span><span class="b"></span><span class="b"></span>
    </button>
    <em class="cc-burger-n" id="navCount" hidden></em>
  </div>
  <main class="cc-main" id="root"><p class="muted">Loading…</p></main>
  <aside class="cc-rail" id="rail"></aside>
</div>

<div class="cc-scrim" id="navScrim" hidden></div>
<nav class="cc-nav" id="nav" aria-label="All screens"></nav>

<script type="module" src="admin.js?v=69"></script>
</body>
</html>
