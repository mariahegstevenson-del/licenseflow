<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign in — LicenseFlow</title>
<link rel="stylesheet" href="styles.css?v=5"/>
<script src="config.js"></script>
</head>
<body>
<div class="screen">
  <div class="screen-inner">
    <a class="brand" href="index.html" style="justify-content:center;margin-bottom:20px"><span class="mark">L</span> LicenseFlow</a>
    <div class="card pad">
      <h2 id="title" style="text-align:center;font-size:1.5rem">Create your account</h2>
      <p class="muted center" id="sub" style="margin-top:0">Register to start your licensing walkthrough</p>
      <div class="tabs">
        <button id="tabSignup" class="on" type="button">Create account</button>
        <button id="tabLogin" type="button">Log in</button>
      </div>
      <div id="alert" class="alert"></div>
      <form id="form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"/>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password"/>
        <button id="submit" class="btn btn-primary btn-block" type="submit" style="margin-top:18px">Create account</button>
      </form>
      <p class="hint center" id="hint" style="margin-top:14px"></p>
    </div>
  </div>
</div>
<script type="module" src="auth.js?v=3"></script>
</body>
</html>
