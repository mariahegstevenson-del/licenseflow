<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log in — LicenseFlow</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@600;700;800&display=swap"/>
<link rel="stylesheet" href="auth.css?v=4"/>
<script src="config.js"></script>
</head>
<body>
<div class="screen">
  <div class="screen-inner">
    <a class="brand" href="index.html" style="justify-content:center;margin-bottom:8px"><span class="mark">L</span> LicenseFlow</a>
    <div class="agency-line" data-agency-name hidden></div>
    <div class="card pad">
      <h2 id="title" style="text-align:center;font-size:1.5rem">Welcome back</h2>
      <p class="muted center" id="sub" style="margin-top:0">Log in to continue your licensing walkthrough</p>

      <div id="alert" class="alert"></div>

      <button id="google" class="btn btn-ghost btn-block btn-google" type="button">
        <svg class="g-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.35 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.65 3.58 9 3.58z"/>
        </svg>
        <span class="g-label">Continue with Google</span>
      </button>

      <div class="or"><span>or</span></div>

      <form id="form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"/>
        <div id="pwWrap">
          <div class="lbl-row">
            <label for="password">Password</label>
            <a href="#" id="forgot" class="lnk-quiet">Forgot your password?</a>
          </div>
          <input id="password" name="password" type="password" required minlength="6" autocomplete="current-password"/>
        </div>
        <button id="submit" class="btn btn-primary btn-block" type="submit" style="margin-top:18px">Log in</button>
      </form>

      <p class="hint center" id="hint" style="margin-top:14px"></p>
    </div>

    <!-- Accounts are created by the agency, not self-served. Someone who
         can't get in needs to know why and what to do about it. -->
    <p class="hint center" style="margin-top:18px">
      Don't have an account? Your agency sets one up for you — ask your licensing coordinator.
    </p>
    <p class="hint center" style="margin-top:6px">
      Run an agency? <a href="https://calendly.com/admin-lifelicenseflow/30min" target="_blank" rel="noopener">Schedule a call</a>.
    </p>
  </div>
</div>
<script type="module" src="auth.js?v=8"></script>
</body>
</html>
